name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: docker build -t cafe-ai .
      - name: run
        run: |
          docker run -d --name cafe -p 8080:8080 -e SEED_DEMO=1 cafe-ai
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
      - name: smoke test
        run: |
          curl -sf localhost:8080/ready
          curl -sf localhost:8080/api/stats
          curl -sf -X POST localhost:8080/api/ai/sentiment -H 'content-type: application/json' \
            -d '{"text":"라떼가 고소하고 맛있어요"}'
          curl -sf localhost:8080/ | grep -q "Cafe AI"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: screenshots
        run: |
          pip install playwright==1.49.1
          playwright install --with-deps chromium
          python .github/scripts/screenshots.py
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/
      - if: failure()
        run: docker logs cafe
